<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIPSAFE — Nos plaquettes</title>
<style>
  :root{--navy:#0A2E5C;--accent:#00AEEF;--muted:#5f6b7a;--border:#e2e8f0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f2f5f9;color:#12233c;min-height:100vh;display:flex;flex-direction:column}
  .hero{background:var(--navy);color:#fff;padding:34px 20px 30px;text-align:center}
  .hero .logo{font-size:26px;font-weight:800;letter-spacing:1.5px}
  .hero .logo span{color:var(--accent)}
  .hero .bl{font-size:12.5px;color:#bcd4ec;margin-top:4px;letter-spacing:.4px}
  .hero h1{font-size:19px;font-weight:700;margin-top:18px}
  .hero p{font-size:13.5px;color:#cfe0f2;margin-top:6px}
  main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:26px 18px 10px}
  .cards{display:grid;gap:14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 10px rgba(10,46,92,.05)}
  .ic{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:#eaf6fd}
  .tt{font-size:16px;font-weight:800;color:var(--navy)}
  .dd{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
  .grow{flex:1;min-width:0}
  .btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:9px;white-space:nowrap}
  .btn:hover{background:#0d3a73}
  .loading{color:var(--muted);font-size:13px;text-align:center;padding:20px}
  footer{text-align:center;padding:26px 16px 30px;font-size:12.5px;color:var(--muted);line-height:1.7}
  footer a{color:var(--accent);text-decoration:none;font-weight:700}
  @media(max-width:560px){.card{flex-direction:column;text-align:center}.btn{width:100%;text-align:center}}
</style>
</head>
<body>
  <div class="hero">
    <div class="logo">KIP<span>SAFE</span></div>
    <div class="bl">Keep Internet Productive &amp; Safe</div>
    <h1>Nos plaquettes</h1>
    <p>Merci de votre intérêt — retrouvez ici nos documents de présentation.</p>
  </div>
  <main>
    <div class="cards" id="cards"><div class="loading">Chargement…</div></div>
  </main>
  <footer>
    KIPSAFE — Cybersécurité &amp; Infogérance<br>
    01 84 23 27 37 · <a href="https://kipsafe.fr">kipsafe.fr</a> · <a href="mailto:sgalin@kipsafe.fr">sgalin@kipsafe.fr</a>
  </footer>
<script>
// Les cartes s'affichent selon les PDF réellement présents dans ce même dossier public.
const BASE='https://graujqkrxxceskgnqfin.supabase.co/storage/v1/object/public/plaquettes/';
const DOCS=[
  {file:'kipsafe-presentation.pdf', icon:'🏢', titre:'Présentation KIPSAFE',
   desc:'Qui nous sommes, notre approche et nos services de cybersécurité & infogérance.'},
  {file:'kipsafe-audit.pdf', icon:'🔍', titre:'Plaquette Audit',
   desc:'Nos audits de sécurité : périmètre, méthode et livrables.'},
  {file:'Kipsafe - Promisec PEM.pdf', icon:'🛡️', titre:'PEM — Promisec Endpoint Manager',
   desc:'La visibilité et la conformité de votre parc en continu, sans agent.'},
];
(async()=>{
  const zone=document.getElementById('cards');
  const cards=[];
  for(const d of DOCS){
    const url=BASE+encodeURIComponent(d.file);
    try{
      const r=await fetch(url,{method:'HEAD'});
      if(!r.ok) continue;
      cards.push(`<div class="card"><div class="ic">${d.icon}</div><div class="grow"><div class="tt">${d.titre}</div><div class="dd">${d.desc}</div></div><a class="btn" href="${url}" target="_blank" rel="noopener">📄 Ouvrir le PDF</a></div>`);
    }catch(e){/* fichier absent : carte masquée */}
  }
  zone.innerHTML=cards.length?cards.join(''):'<div class="loading">Documents bientôt disponibles — contactez-nous : <a href="mailto:sgalin@kipsafe.fr">sgalin@kipsafe.fr</a></div>';
})();
</script>
</body>
</html>
