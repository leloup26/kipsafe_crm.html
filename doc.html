<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>KIPSAFE — Document partagé</title>
<style>
  :root{--navy:#1f3864;--accent:#2a5aa0;--light:#f4f6fa;--border:#e2e8f0;--muted:#8a94a6;--red:#dc2626;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--light);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--navy);padding:14px 22px;display:flex;align-items:center;gap:10px}
  header .logo{color:#fff;font-size:17px;font-weight:800;letter-spacing:1.5px}
  header .sub{color:#9db2d0;font-size:12px}
  main{flex:1;display:flex;flex-direction:column;padding:18px;max-width:1100px;width:100%;margin:0 auto}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:28px;text-align:center}
  .doc-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px;word-break:break-word}
  .hint{font-size:12px;color:var(--muted)}
  .spinner{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:18px auto;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:12px 26px;border-radius:8px;font-size:15px;font-weight:700;margin-top:14px}
  .btn:hover{background:var(--accent)}
  .viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .viewer-bar .btn{margin-top:0;padding:8px 16px;font-size:13px}
  iframe{width:100%;flex:1;min-height:70vh;border:1px solid var(--border);border-radius:12px;background:#fff}
  .err{color:var(--red);font-weight:700;font-size:15px}
  footer{padding:12px;text-align:center;font-size:12px;color:var(--muted)}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <span class="logo">KIPSAFE</span>
  <span class="sub">Cybersécurité · Espace documents</span>
</header>
<main id="main">
  <div class="card" id="state">
    <div class="doc-title">Ouverture de votre document…</div>
    <div class="spinner"></div>
    <div class="hint">Un instant, nous préparons votre document sécurisé.</div>
  </div>
</main>
<footer>KIPSAFE — Conseil en cybersécurité · <a href="https://kipsafe.fr" target="_blank" rel="noopener">kipsafe.fr</a></footer>
<script>
(function(){
  var FN_URL='https://graujqkrxxceskgnqfin.supabase.co/functions/v1/doc-open';
  var state=document.getElementById('state');
  var main=document.getElementById('main');
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fail(msg){
    state.innerHTML='<div style="font-size:38px;margin-bottom:10px">🔒</div>'+
      '<div class="err">'+esc(msg)+'</div>'+
      '<div class="hint" style="margin-top:8px">Si vous pensez qu\'il s\'agit d\'une erreur, répondez simplement à l\'email que vous avez reçu.</div>';
  }
  var token=new URLSearchParams(location.search).get('t');
  if(!token){fail('Lien incomplet — utilisez le lien exact reçu par email.');return;}
  fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(!res.ok||!res.j||res.j.error){fail((res.j&&res.j.error)||'Lien invalide ou expiré.');return;}
      var name=res.j.doc_name||'Document';
      var url=res.j.url;
      document.title='KIPSAFE — '+name;
      var ext=(name.split('.').pop()||'').toLowerCase();
      var preview=['pdf','jpg','jpeg','png','gif','webp','svg'].indexOf(ext)>=0;
      if(preview){
        main.innerHTML='<div class="viewer-bar">'+
          '<div class="doc-title">📄 '+esc(name)+'</div>'+
          '<a class="btn" href="'+url+'" download="'+esc(name)+'" target="_blank" rel="noopener">⬇️ Télécharger</a>'+
          '</div><iframe src="'+url+'" title="'+esc(name)+'"></iframe>';
      } else {
        state.innerHTML='<div style="font-size:38px;margin-bottom:10px">📄</div>'+
          '<div class="doc-title">'+esc(name)+'</div>'+
          '<div class="hint">Ce type de fichier se télécharge pour être consulté.</div>'+
          '<a class="btn" href="'+url+'" download="'+esc(name)+'" target="_blank" rel="noopener">⬇️ Télécharger le document</a>'+
          '<div class="hint" style="margin-top:12px">Lien de téléchargement valable 1 heure — rouvrez le lien de l\'email si besoin.</div>';
      }
    })
    .catch(function(){fail('Connexion impossible — réessayez dans un instant.');});
})();
</script>
</body>
</html>
