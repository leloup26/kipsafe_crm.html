<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LMDK — Nouveau mot de passe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js" integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9" crossorigin="anonymous"></script>
<style>
:root{--green:#15803d;--navy:#1f2937;--muted:#6b7280;--border:#e5e7eb;--red:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f8f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:30px 26px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{font-size:19px;margin-bottom:6px}
.sub{font-size:13px;color:var(--muted);margin-bottom:20px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;padding:13px;border:1.5px solid var(--border);border-radius:10px;font-size:16px}
input:focus{outline:none;border-color:var(--green)}
button{width:100%;margin-top:20px;padding:14px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:12px;font-size:13.5px;min-height:18px}
.err{color:var(--red)} .ok{color:var(--green);font-weight:700}
.links{margin-top:18px;display:none;flex-direction:column;gap:8px}
.links a{display:block;text-align:center;padding:12px;border:1.5px solid var(--green);border-radius:10px;color:var(--green);font-weight:700;text-decoration:none;font-size:14px}
.badge{display:inline-block;background:#dcfce7;color:var(--green);font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;margin-bottom:14px}
</style>
</head>
<body>
<div class="card">
  <div class="badge">📖 LA MAISON DE KELM</div>
  <h1>Nouveau mot de passe</h1>
  <div class="sub" id="sub">Choisis le nouveau mot de passe de ton compte CRM LMDK.</div>
  <div id="form">
    <label>Nouveau mot de passe (8 caractères min.)</label>
    <input type="password" id="pw1" autocomplete="new-password">
    <label>Confirmer</label>
    <input type="password" id="pw2" autocomplete="new-password" onkeydown="if(event.key==='Enter')go()">
    <button id="btn" onclick="go()">Enregistrer le mot de passe</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="links" id="links">
    <a href="https://app.lamaisondekelm.fr/">Ouvrir le CRM LMDK</a>
    <a href="https://leloup26.github.io/kipsafe_crm.html/taches.html">Ouvrir l'app Mes tâches</a>
  </div>
</div>
<script>
const sb=window.supabase.createClient('https://yjiukywrsguoevavddru.supabase.co','sb_publishable_DeaIffrmBM3Q8E0rdYaOFw_LBdsXfn5',{auth:{persistSession:true,detectSessionInUrl:true,storageKey:'lmdk-reset'}});
const msg=(t,cls)=>{const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(cls||'');};
let ready=false;
// Le lien de l'email arrive ici avec un jeton de récupération dans l'URL :
// supabase-js l'échange automatiquement contre une session (detectSessionInUrl).
(async function(){
  try{
    // laisser le temps à l'échange du jeton de l'URL
    for(let i=0;i<20&&!ready;i++){
      const{data:{session}}=await sb.auth.getSession();
      if(session){ready=true;break;}
      await new Promise(r=>setTimeout(r,250));
    }
    if(ready){msg('Lien vérifié ✓ — choisis ton mot de passe.','ok');}
    else{
      const h=location.hash+location.search;
      if(/error/.test(h)){msg('Lien expiré ou déjà utilisé — redemande un email de réinitialisation.','err');}
      else{msg('Ce lien doit être ouvert depuis l\'email « Reset password ».','err');}
    }
  }catch(e){msg('Erreur : '+(e.message||e),'err');}
})();
async function go(){
  const p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value;
  if(p1.length<8){msg('8 caractères minimum.','err');return;}
  if(p1!==p2){msg('Les deux mots de passe ne correspondent pas.','err');return;}
  if(!ready){msg('Le lien n\'est pas valide — ouvre cette page depuis l\'email de réinitialisation.','err');return;}
  const b=document.getElementById('btn');b.disabled=true;b.textContent='Enregistrement…';
  const{error}=await sb.auth.updateUser({password:p1});
  b.disabled=false;b.textContent='Enregistrer le mot de passe';
  if(error){msg('❌ '+error.message,'err');return;}
  document.getElementById('form').style.display='none';
  msg('✅ Mot de passe enregistré ! Tu peux te connecter au CRM LMDK et à l\'app Tâches avec.','ok');
  document.getElementById('links').style.display='flex';
  try{await sb.auth.signOut();}catch(e){}
}
</script>
</body>
</html>
